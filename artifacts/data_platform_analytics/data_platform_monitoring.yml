- hosts: localhost
  connection: local
  tasks:
  - name: Install native host metrics on each private interface
    ansible.builtin.apt:
      name: prometheus-node-exporter
      policy_rc_d: 101
      state: present
      update_cache: true
      cache_valid_time: 3600
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Create the private metrics text directory
    ansible.builtin.file:
      path: /var/lib/prometheus/node-exporter
      state: directory
      mode: '0755'
      owner: root
      group: root
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Install the immutable local health collector
    ansible.builtin.get_url:
      url: '{{ platform_monitor_collector_url }}'
      checksum: '{{ platform_monitor_collector_checksum }}'
      dest: /usr/local/bin/data-platform-collect-metrics
      mode: '0755'
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Configure local health collection without exporting secrets
    ansible.builtin.copy:
      content: '{{ {''component'':item,''host'':platform_monitor_hosts[item],''services'':platform_monitor_services[item]}
        | to_nice_json }}'
      dest: /etc/data-platform-monitor.json
      mode: '0600'
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Install the local health collection service
    ansible.builtin.copy:
      content: '[Unit]

        Description=Local data platform service and flow metrics

        [Service]

        Type=oneshot

        ExecStart=/usr/bin/python3 /usr/local/bin/data-platform-collect-metrics

        '
      dest: /etc/systemd/system/data-platform-metrics.service
      mode: '0644'
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Schedule local health collection
    ansible.builtin.copy:
      content: '[Unit]

        Description=Collect private data platform metrics every minute

        [Timer]

        OnBootSec=30s

        OnUnitActiveSec=60s

        [Install]

        WantedBy=timers.target

        '
      dest: /etc/systemd/system/data-platform-metrics.timer
      mode: '0644'
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Enable the health collection timer
    ansible.builtin.systemd:
      name: data-platform-metrics.timer
      daemon_reload: true
      state: started
      enabled: true
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Collect and verify local health metrics now
    ansible.builtin.command:
      argv:
      - /usr/bin/python3
      - /usr/local/bin/data-platform-collect-metrics
    changed_when: false
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Verify real service health and flow probes before accepting monitoring
    ansible.builtin.command:
      argv:
      - /usr/bin/python3
      - -c
      - from pathlib import Path; rows=Path('/var/lib/prometheus/node-exporter/data-platform.prom').read_text().splitlines();
        checks=[row for row in rows if row.startswith(('platform_service_up{','platform_probe_success ','platform_flink_job_running
        '))]; assert checks and all(float(row.rsplit(' ',1)[1])==1 for row in checks), 'A service or flow probe
        is unhealthy'; print('PRIVATE_LOCAL_HEALTH_OK')
    changed_when: false
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Bind host metrics to the selected private address
    ansible.builtin.copy:
      content: ARGS="--web.listen-address={{ platform_monitor_hosts[item] }}:9100 --collector.textfile.directory=/var/lib/prometheus/node-exporter"
      dest: /etc/default/prometheus-node-exporter
      mode: '0644'
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
    register: monitor_exporter_config
  - name: Apply changed host metric bindings
    ansible.builtin.systemd:
      name: prometheus-node-exporter
      state: restarted
      enabled: true
    delegate_to: '{{ groups[item.item][0] }}'
    connection: ssh
    become: true
    loop: '{{ monitor_exporter_config.results }}'
    when: item.changed
  - name: Enable every private host exporter
    ansible.builtin.systemd:
      name: prometheus-node-exporter
      state: started
      enabled: true
    delegate_to: '{{ groups[item][0] }}'
    connection: ssh
    become: true
    loop: '{{ platform_monitor_groups }}'
  - name: Install the private monitoring server
    ansible.builtin.apt:
      name: prometheus
      policy_rc_d: 101
      state: present
      update_cache: true
      cache_valid_time: 3600
  - name: Bind monitoring UI to loopback only
    ansible.builtin.copy:
      content: ARGS="--web.listen-address=127.0.0.1:9090 --storage.tsdb.path=/srv/apache-superset/prometheus --storage.tsdb.retention.time=7d"
      dest: /etc/default/prometheus
      mode: '0644'
    notify: Restart private monitoring
  - name: Keep monitoring history on the persistent disk
    ansible.builtin.file:
      path: /srv/apache-superset/prometheus
      state: directory
      owner: prometheus
      group: prometheus
      mode: '0750'
  - name: Configure private host and ClickHouse targets
    ansible.builtin.copy:
      content: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\nrule_files:\n  - /etc/prometheus/data-platform-rules.yml\n\
        scrape_configs:\n  - job_name: platform-hosts\n    static_configs:\n{% for group in platform_monitor_groups\
        \ %}\n      - targets: ['{{ platform_monitor_hosts[group] }}:9100']\n        labels:\n          node: '{{\
        \ group }}'\n{% endfor %}\n  - job_name: clickhouse\n    static_configs:\n      - targets: ['{{ platform_monitor_clickhouse_host\
        \ }}:9363']\n"
      dest: /etc/prometheus/prometheus.yml
      mode: '0644'
    notify: Restart private monitoring
  - name: Configure availability and disk-space rules
    ansible.builtin.copy:
      content: "groups:\n- name: data-platform\n  rules:\n  - alert: PlatformTargetDown\n    expr: up == 0\n   \
        \ for: 2m\n    labels:\n      severity: critical\n  - alert: PlatformDiskSpaceLow\n    expr: node_filesystem_avail_bytes{fstype!~\"\
        tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes\n      < 0.15\n    for: 5m\n    labels:\n      severity:\
        \ warning\n  - alert: PlatformServiceDown\n    expr: platform_service_up == 0\n    for: 2m\n    labels:\n\
        \      severity: critical\n  - alert: PlatformFlowProbeFailed\n    expr: platform_probe_success == 0 or\
        \ time() - platform_probe_timestamp_seconds\n      > 180\n    for: 2m\n    labels:\n      severity: warning\n\
        \  - alert: PlatformSubscriptionBacklog\n    expr: platform_pulsar_subscription_backlog > 1000\n    for:\
        \ 5m\n    labels:\n      severity: warning\n  - alert: PlatformFlinkCheckpointStale\n    expr: platform_flink_job_running\
        \ == 0 or time() - platform_flink_last_checkpoint_timestamp_seconds\n      > 180\n    for: 3m\n    labels:\n\
        \      severity: critical\n"
      dest: /etc/prometheus/data-platform-rules.yml
      mode: '0644'
    notify: Restart private monitoring
  - name: Install deterministic alert rule verification
    ansible.builtin.copy:
      content: "rule_files:\n- /etc/prometheus/data-platform-rules.yml\nevaluation_interval: 1m\ntests:\n- interval:\
        \ 1m\n  input_series:\n  - series: up{job=\"platform-hosts\",instance=\"test:9100\"}\n    values: 0 0 0\
        \ 0 0 0\n  alert_rule_test:\n  - eval_time: 3m\n    alertname: PlatformTargetDown\n    exp_alerts:\n   \
        \ - exp_labels:\n        job: platform-hosts\n        instance: test:9100\n        severity: critical\n\
        \      exp_annotations: {}\n"
      dest: /etc/prometheus/data-platform-rule-tests.yml
      mode: '0644'
  - name: Verify that a failed target activates the availability rule
    ansible.builtin.command: promtool test rules /etc/prometheus/data-platform-rule-tests.yml
    changed_when: false
  - name: Validate configuration before applying it
    ansible.builtin.command: promtool check config /etc/prometheus/prometheus.yml
    changed_when: false
  - ansible.builtin.meta: flush_handlers
  - name: Enable monitoring at boot
    ansible.builtin.systemd:
      name: prometheus
      state: started
      enabled: true
  - name: Verify every private scrape target
    ansible.builtin.uri:
      url: http://127.0.0.1:9090/api/v1/targets
      return_content: true
    register: monitoring_targets
    until: monitoring_targets.json.data.activeTargets | length == 7 and monitoring_targets.json.data.activeTargets
      | selectattr('health', 'equalto', 'up') | list | length == 7
    retries: 12
    delay: 10
  - ansible.builtin.debug:
      msg: DATA_PLATFORM_PRIVATE_MONITORING_OK
  handlers:
  - name: Restart private monitoring
    ansible.builtin.systemd:
      name: prometheus
      state: restarted
