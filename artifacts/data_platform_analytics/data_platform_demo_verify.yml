---
- hosts: localhost
  connection: local
  tasks:
    - name: Download the immutable CSV verification program
      ansible.builtin.get_url:
        url: "{{ platform_demo_verifier_url }}"
        checksum: "{{ platform_demo_verifier_checksum }}"
        dest: /usr/local/bin/data-platform-demo-verify
        mode: '0755'
    - name: Verify CSV replay SQL aggregates and exact dCache payloads
      ansible.builtin.command:
        argv:
          - /opt/data-platform-analytics/bin/python
          - /usr/local/bin/data-platform-demo-verify
      changed_when: false
      register: platform_demo_result
    - name: Report reproducible flow verification
      ansible.builtin.debug:
        msg: "{{ platform_demo_result.stdout_lines }}"
