tosca_definitions_version: tosca_simple_yaml_1_0

imports:
  - grycap_custom_types: https://raw.githubusercontent.com/grycap/tosca/main/custom_types.yaml

description: Deploy standalone dCache with local PostgreSQL and HTTPS WebDAV on a VM.

metadata:
  template_version: "1.0.0"
  template_name: dCache
  template_author: rmp2000
  creation_date: 2026-10-14

topology_template:
  inputs:
    num_cpus:
      type: integer
      description: Number of CPUs for the dCache VM.
      default: 2
      constraints:
        - greater_or_equal: 2
    mem_size:
      type: scalar-unit.size
      description: Memory for dCache and its local PostgreSQL database.
      default: 4 GB
    disk_size:
      type: scalar-unit.size
      description: Root disk size, including PostgreSQL namespace metadata.
      default: 30 GiB
    storage_size:
      type: scalar-unit.size
      description: Additional disk for the dCache file storage pool.
      default: 20 GiB
    dcache_vm_image:
      type: string
      description: Ubuntu 22.04 image URL; defaults to Ramses.
      default: one://ramses.i3m.upv.es/1593
    dcache_webdav_port:
      type: integer
      description: HTTPS WebDAV port.
      default: 2880
      constraints:
        - in_range: [ 1, 65535 ]
    dcache_user:
      type: string
      description: Authenticated WebDAV user.
      default: dcacheuser
    dcache_password:
      type: string
      description: WebDAV password, generated by IM by default.
      default: "random(32)"
    dcache_database_password:
      type: string
      description: Password for the local Chimera database, generated by IM.
      default: "random(32)"

  node_templates:
    simple_node:
      type: tosca.nodes.indigo.Compute
      capabilities:
        endpoint:
          properties:
            network_name: PUBLIC
            ports:
              ssh_port:
                source: 22
                protocol: tcp
        host:
          properties:
            num_cpus: { get_input: num_cpus }
            mem_size: { get_input: mem_size }
            disk_size: { get_input: disk_size }
        os:
          properties:
            type: linux
            distribution: ubuntu
            version: "22.04"
            image: { get_input: dcache_vm_image }
      requirements:
        - local_storage:
            node: my_block_storage
            relationship:
              type: tosca.relationships.AttachesTo
              properties:
                location: /srv/dcache

    my_block_storage:
      type: tosca.nodes.BlockStorage
      properties:
        size: { get_input: storage_size }

    dcache:
      type: tosca.nodes.ec3.Application
      artifacts:
        dcache_role:
          file: https://github.com/rmp2000/ansible-role-dcache/archive/17ca4f23c06ee55bd44364f352d5039b9c8bf7b8.tar.gz|dcache
          type: tosca.artifacts.AnsibleGalaxy.role
        postgresql_role:
          file: https://github.com/rmp2000/ansible-role-postgresql/archive/255211cded8db851ea916914dfe4f3a7b9ce6dee.tar.gz|postgresql
          type: tosca.artifacts.AnsibleGalaxy.role
        postgresql_collection:
          file: community.postgresql
          type: tosca.artifacts.AnsibleGalaxy.collection
        general_collection:
          file: community.general
          type: tosca.artifacts.AnsibleGalaxy.collection
      capabilities:
        endpoint:
          properties:
            ports:
              webdav:
                source: { get_input: dcache_webdav_port }
                protocol: tcp
      requirements:
        - host: simple_node
      interfaces:
        Standard:
          configure:
            implementation: https://raw.githubusercontent.com/rmp2000/tosca/feature/dcache-recipe/artifacts/dcache/dcache_install.yml
            inputs:
              dcache_webdav_port: { get_input: dcache_webdav_port }
              dcache_user: { get_input: dcache_user }
              dcache_password: { get_input: dcache_password }
              dcache_database_password: { get_input: dcache_database_password }

  outputs:
    dcache_host:
      value: { get_attribute: [ simple_node, public_address, 0 ] }
    dcache_endpoint:
      value:
        concat:
          - 'https://'
          - { get_attribute: [ simple_node, public_address, 0 ] }
          - ':'
          - { get_input: dcache_webdav_port }
          - '/data/'
    dcache_user:
      value: { get_input: dcache_user }
    dcache_password:
      value: { get_input: dcache_password }
    dcache_database_password:
      description: Local database credential retained for authenticated reconfiguration.
      value: { get_input: dcache_database_password }
    dcache_ca_certificate:
      description: Trust this generated certificate on clients before using HTTPS WebDAV.
      value: /etc/dcache/tls/hostcert.pem
    node_ip:
      value: { get_attribute: [ simple_node, public_address, 0 ] }
    node_creds:
      value: { get_attribute: [ simple_node, endpoint, credential, 0 ] }
